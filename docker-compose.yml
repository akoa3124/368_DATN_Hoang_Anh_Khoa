version: '3.9'

services:
  mongo:
    image: mongo:6.0
    container_name: phongtro123_mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: phongtro123_backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - ./.env
    depends_on:
      - mongo

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL}
        VITE_CLIENT_ID: ${VITE_CLIENT_ID}
        VITE_SECRET_CRYPTO: ${VITE_SECRET_CRYPTO}
        VITE_API_KEY: ${VITE_API_KEY}
    container_name: phongtro123_frontend
    restart: unless-stopped
    ports:
      - '3001:80'
    depends_on:
      - backend

volumes:
  mongo_data:
